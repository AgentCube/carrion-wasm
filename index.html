<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CARRION — WebAssembly</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      color: #ffffff;
      overflow: hidden;
    }
    #canvas-wrapper {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;
      background: #000000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: crosshair;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000000;
      color: #ffffff;
      font-family: monospace;
      z-index: 100;
    }
    #loading-overlay.hidden {
      display: none !important;
      pointer-events: none !important;
    }
    #loading-box {
      text-align: center;
      max-width: 600px;
      padding: 20px;
    }
    #loading-title {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 0.1em;
      margin-bottom: 20px;
      color: #ffffff;
    }
    #loading-progress {
      font-size: 14px;
      color: #ffffff;
      min-height: 1.5em;
    }
    .loading-notice {
      color: #e0af68;
      margin-top: 15px;
      font-size: 13px;
      line-height: 1.4;
    }
    #fps-counter {
      position: fixed;
      top: 10px;
      right: 12px;
      background: rgba(0, 0, 0, 0.75);
      color: #4ade80;
      font-family: monospace, Consolas, Courier, sans-serif;
      font-size: 13px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid rgba(74, 222, 128, 0.35);
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="canvas-wrapper">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="fps-counter">-- FPS</div>
    <div id="loading-overlay">
      <div id="loading-box">
        <div id="loading-title">CARRION (WASM)</div>
        <div id="loading-progress">Loading: 0 / 603 (0%)</div>
        <div class="loading-notice">Note: Music is turned off for smoother performance.</div>
      </div>
    </div>
  </div>
  <script>
    const canvasEl = document.getElementById('canvas');
    if (canvasEl) {
      canvasEl.addEventListener('click', () => {
        if (document.pointerLockElement !== canvasEl) {
          canvasEl.requestPointerLock?.();
        }
      });
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
